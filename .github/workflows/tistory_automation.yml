name: Tistory Auto Login Test

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4

    - name: Node.js 설정 및 npm 캐시 활성화
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 1. npm 패키지 빠르게 설치 (package-lock.json 기반)
    - name: 의존성 패키지 설치
      run: npm ci || npm install

    # 2. Playwright 크로미늄 캐싱 설정
    - name: Playwright 크로미늄 캐시 설정
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    # 3. 캐시가 없을 때만 크로미늄 다운로드
    - name: 크로미늄 브라우저 설치
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps

    # 4. 캐시 성공 시 필수 실행 환경만 복구
    - name: 필수 라이브러리 복구
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: 크로미늄 자동 로그인 실행
      env:
        KAKAO_ID: ${{ secrets.KAKAO_ID }}
        KAKAO_PW: ${{ secrets.KAKAO_PW }}
      run: node tistory_login.js

    - name: 캡처된 PNG 파일 저장소에 직접 저장
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ -f error_screenshot.png ]; then
          git add error_screenshot.png
          git commit -m "📸 캡처 이미지 업데이트" || exit 0
          git push
        fi
