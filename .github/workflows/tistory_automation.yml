name: Tistory Auto Login Test

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v3

    - name: Node.js 설치
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: 의존성 패키지 설치
      run: |
        npm init -y
        npm install playwright

    - name: Playwright 크로미늄 캐시 확인
      uses: actions/cache@v3
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: 크로미늄 및 시스템 라이브러리 설치
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps

    - name: 크로미늄 실행 라이브러리 보장
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: 크로미늄 자동 로그인 실행
      env:
        KAKAO_ID: ${{ secrets.KAKAO_ID }}
        KAKAO_PW: ${{ secrets.KAKAO_PW }}
      run: node tistory_login.js

    # 압축(zip) 파일 방식 대신 GitHub 저장소에 .png 이미지 파일 직접 커밋 및 push
    - name: 캡처된 PNG 파일 저장소에 직접 저장
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # error_screenshot.png 파일이 존재할 때만 저장소에 커밋
        if [ -f error_screenshot.png ]; then
          git add error_screenshot.png
          git commit -m "📸 [Auto Log] 캡처 이미지 업데이트 (error_screenshot.png)" || exit 0
          git push
        fi
