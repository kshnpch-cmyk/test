name: Tistory Auto Login Test

on:
  # 웹사이트 버튼 클릭 이벤트 또는 Actions 탭에서 수동 실행
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    # 저장소에 캡처 이미지(PNG)를 커밋/푸시할 수 있는 쓰기 권한 부여
    permissions:
      contents: write

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4

    - name: Node.js 설정 및 npm 캐시 활성화
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 1. package.json 기반 의존성 설치
    - name: 의존성 패키지 설치
      run: npm install

    # 2. Playwright 크로미늄 브라우저 캐싱 설정
    - name: Playwright 크로미늄 캐시 확인
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    # 3. 캐시가 없을 때만 크로미늄 다운로드
    - name: 크로미늄 브라우저 설치
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps

    # 4. 캐시 히트 시에도 시스템 필수 라이브러리 보장
    - name: 크로미늄 필수 실행 라이브러리 보장
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    # 5. 티스토리 로그인 자동화 실행 (Secrets 정보 전달)
    - name: 크로미늄 자동 로그인 실행
      env:
        KAKAO_ID: ${{ secrets.KAKAO_ID }}
        KAKAO_PW: ${{ secrets.KAKAO_PW }}
      run: node tistory_login.js

   # 6. error_screenshot.png 파일이 존재하면 무조건 커밋하여 저장소에 push
    - name: 캡처된 PNG 파일 저장소에 직접 저장
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ -f error_screenshot.png ]; then
          git add -f error_screenshot.png
          git commit -m "📸 [Auto Log] 캡처 이미지 업데이트 (error_screenshot.png)" || exit 0
          git push
        fi
