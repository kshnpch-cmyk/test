name: Auto Build & Deploy Blog

on:
  workflow_dispatch: # 수동 실행 또는 버튼 요청

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4

    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 블로그 HTML 자동 생성 실행
      run: node build_blog.js

    - name: GitHub Pages에 자동 반영 (Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add posts/ index.html
        git commit -m "🚀 [Auto Post] 새로운 블로그 리포트 발행 완료" || exit 0
        git push
