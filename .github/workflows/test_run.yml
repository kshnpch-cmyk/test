name: Run Price Update

on:
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치 (beautifulsoup4 추가)
        run: pip install gspread google-auth google-auth-oauthlib requests beautifulsoup4

      - name: 가격 조사 및 시트 업데이트 스크립트 실행
        env:
          GCP_TOKEN_JSON: ${{ secrets.GCP_TOKEN_JSON }}
        run: python update_price.py
