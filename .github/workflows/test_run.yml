name: Price Update Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-price:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 📌 1. pip 패키지 캐시
      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 📌 2. Playwright 브라우저 바이너리 캐시
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright
          restore-keys: |
            ${{ runner.os }}-playwright

      # 📌 3. HuggingFace BERT 모델 파일 캐시
      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models
          restore-keys: |
            ${{ runner.os }}-hf-models

      # 📌 4. anthropic 패키지 추가 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth google-auth-oauthlib beautifulsoup4 curl_cffi google-genai tenacity playwright sentence-transformers torch Pillow anthropic
          playwright install chromium

      # 📌 5. ANTHROPIC_API_KEY 환경변수 등록
      - name: Run price update script
        env:
          GCP_TOKEN_JSON: ${{ secrets.GCP_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update_price.py
