name: Price Update Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 매일 정해진 시간에 자동 실행 (필요 시 조정)

jobs:
  update-price:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth google-auth-oauthlib beautifulsoup4 curl_cffi

      - name: Run price update script
        env:
          GCP_TOKEN_JSON: ${{ secrets.GCP_TOKEN_JSON }}
        run: python update_price.py
