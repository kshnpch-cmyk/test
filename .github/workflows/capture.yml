name: Auto Capture Bot

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작일'
        required: false
      end_date:
        description: '종료일'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install selenium beautifulsoup4 requests

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: 캡처 및 데이터 전송 실행
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python screenshot.py

      - name: GitHub에 캡처 이미지 덮어쓰기
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add capture.png
          git commit -m "Auto update capture image" || echo "No changes to commit"
          git push
