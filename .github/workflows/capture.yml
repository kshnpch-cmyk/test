name: Auto Capture

on:
  workflow_dispatch:

# 봇이 캡처 이미지를 저장할 수 있도록 '쓰기 권한'을 명시적으로 부여 (128 오류 해결)
permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      # 구버전 경고를 해결하기 위해 v4, v5 최신 버전으로 변경
      - uses: actions/checkout@v4
      
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Selenium 설치
        run: pip install selenium
        
      - name: 캡처 파이썬 파일 실행
        run: python screenshot.py
        
      - name: 캡처된 이미지를 GitHub에 자동 저장
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add capture.png
          git commit -m "캡처 이미지 자동 업데이트" || echo "변경된 내용 없음"
          git push
