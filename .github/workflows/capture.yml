name: OMS Order Capture Bot

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '시작 일자 (YYYY/MM/DD)'
        required: true
        default: ''
      end_date:
        description: '종료 일자 (YYYY/MM/DD)'
        required: true
        default: ''
  schedule:
    # 매일 정해진 시간에 자동 실행 (필요 시 Cron 주기 설정)
    - cron: '0 21 * * *'

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          playwright install chromium

      - name: OMS 데이터 수집 및 Supabase 저장 실행
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          SUPABASE_URL: "https://zbilhsgfgyfrolveaego.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN"
        run: |
          python capture.py

      # 🚀 [추가된 핵심 스텝] 수집 완료 즉시 Supabase 캐시 뷰 갱신 명령 전송
      - name: Supabase 구체화 뷰(MATERIALIZED VIEW) 자동 갱신
        run: |
          curl -X POST "https://zbilhsgfgyfrolveaego.supabase.co/rest/v1/rpc/refresh_daily_summary" \
            -H "apikey: sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN" \
            -H "Authorization: Bearer sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN"
          
          curl -X POST "https://zbilhsgfgyfrolveaego.supabase.co/rest/v1/rpc/refresh_store_summary" \
            -H "apikey: sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN" \
            -H "Authorization: Bearer sb_publishable_OWW3nk7m7Vy3Ex0205ypgg_IG3xdBjN"
          
          echo "✅ Supabase 구체화 뷰 리프레시 요청이 성공적으로 완료되었습니다."
