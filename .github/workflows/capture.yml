name: Auto Capture

on:
  workflow_dispatch: # 버튼을 눌러서 수동 실행할 수 있게 함

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Selenium 설치
        run: pip install selenium
        
      - name: 캡처 파이썬 파일 실행
        run: python screenshot.py
        
      - name: 캡처된 이미지를 GitHub에 자동 저장
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add capture.png
          git commit -m "캡처 이미지 자동 업데이트" || echo "변경된 내용 없음"
          git push
