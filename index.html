<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가격 비교 대시보드</title>
    <!-- 데이터 파싱 및 차트 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 모든 요소에 box-sizing 적용하여 패딩으로 인한 너비 삐져나옴 방지 */
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        
        /* 🔥 수정포인트 1: max-width 제한을 없애고 가로를 항상 창 크기(100%)에 맞춤 */
        .container { 
            width: 100%; 
            margin: 0 auto; 
        }
        
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 24px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-bottom: 24px; 
        }
        
        h1 { margin-top: 0; font-size: 24px; color: #111; }
        
        /* 차트도 가로로 길게 퍼지도록 설정 */
        .chart-container { position: relative; height: 400px; width: 100%; }
        
        /* 🔥 수정포인트 2: 표를 감싸는 영역 (가로 스크롤바 처리) */
        .table-responsive {
            width: 100%;
            overflow-x: auto; /* 창이 좁을 때만 가로 스크롤 생성 */
        }
        
        /* 🔥 수정포인트 3: 테이블 너비 100% 및 텍스트 줄바꿈 방지 */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 14px; 
            white-space: nowrap; /* 셀 안의 텍스트가 두 줄로 쪼개지지 않도록 방지 */
        }
        
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background-color: #f1f3f5; font-weight: 600; color: #495057; }
        tr:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>📊 실시간 가격 경쟁력 대시보드</h1>
        <p>구글 스프레드시트 데이터가 실시간으로 반영됩니다.</p>
    </div>

    <div class="card">
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top:0; font-size: 18px;">전체 데이터 상세</h2>
        <!-- 테이블을 반응형 영역으로 감싸기 -->
        <div class="table-responsive">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 구글 시트 CSV 내보내기 링크
    const sheetId = '1nA0ZtCztY6Qe8UR8-erB98_BIZDYUUjpIQYWNyuePWA';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0`;

    Papa.parse(csvUrl, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data.filter(row => Object.keys(row).length > 0 && Object.values(row)[0] !== "");
            renderTable(data);
            renderChart(data);
        },
        error: function(error) {
            console.error("데이터 로드 실패:", error);
            alert("구글 시트 데이터를 불러오지 못했습니다.");
        }
    });

    function renderTable(data) {
        if(data.length === 0) return;
        const headers = Object.keys(data[0]);
        
        const thead = document.getElementById('tableHead');
        const trHead = document.createElement('tr');
        headers.forEach(h => {
            const th = document.createElement('th');
            th.textContent = h;
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        const tbody = document.getElementById('tableBody');
        data.forEach(row => {
            const tr = document.createElement('tr');
            headers.forEach(h => {
                const td = document.createElement('td');
                td.textContent = row[h] || '-';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function renderChart(data) {
        if(data.length === 0) return;
        
        // ⚠️ 구글 시트의 실제 헤더 이름에 맞춰 '상품명', '자사가격', '최저가'를 수정해야 차트가 보입니다.
        const labels = data.map(row => row['상품명'] || row[Object.keys(row)[0]]); 
        const ourPrices = data.map(row => Number((row['자사가격'] || '0').replace(/[^0-9.-]+/g,"")));
        const lowestPrices = data.map(row => Number((row['최저가'] || '0').replace(/[^0-9.-]+/g,"")));

        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: '자사가격', data: ourPrices, backgroundColor: '#3b82f6', borderRadius: 4 },
                    { label: '인터넷최저가', data: lowestPrices, backgroundColor: '#ef4444', borderRadius: 4 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    }
</script>

</body>
</html>
