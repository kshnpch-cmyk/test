        const SUPABASE_URL = "https://zbilhsgfgyfrolveaego.supabase.co";

        const githubId = 'kshnpch-cmyk'; 
        const repoName = 'dashboard'; 

        const tokenPart1 = "ghp_DPLQYilEaFD";
        const tokenPart2 = "g2jVxPlK8Kh18uwaCu220wnZB";
        const token = tokenPart1 + tokenPart2;

        let rawDetailOrders = [], filteredDetailOrders = [], baseDetailOrders = [], currentDetailOrders = [];
        let storeSummaryList = [];
        let trendChart = null;

        let allBrandList = [], allItemList = [];
        let activeBrandTarget = 'chart';

        /* 💾 [2번 IndexedDB 엔진] 브라우저 기기 메모리 초고속 캐시 */
        const DB_NAME = "OmsLocalCacheDB";
        const STORE_NAME = "query_cache";

        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "url" });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function getCacheIDB(url) {
            try {
                const db = await openIndexedDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, "readonly");
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.get(url);
                    req.onsuccess = () => {
                        const res = req.result;
                        if (res && (Date.now() - res.timestamp < 1000 * 60 * 15)) { // 15분간 로컬 캐시 유지
                            resolve(res.data);
                        } else {
                            resolve(null);
                        }
                    };
                    req.onerror = () => resolve(null);
                });
            } catch (e) { return null; }
        }

        async function setCacheIDB(url, data) {
            try {
                const db = await openIndexedDB();
                const tx = db.transaction(STORE_NAME, "readwrite");
                const store = tx.objectStore(STORE_NAME);
                store.put({ url, data, timestamp: Date.now() });
            } catch (e) {}
        }

        async function fetchWithUltraCache(url, options, retries = 3) {
            const cachedData = await getCacheIDB(url);
            if (cachedData) {
                return new Response(JSON.stringify(cachedData), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }

            const res = await fetchWithRetry(url, options, retries);
            if (res.ok) {
                const clone = res.clone();
                const jsonData = await clone.json();
                setCacheIDB(url, jsonData);
            }
            return res;
        }

        function safeSetStorage(key, value) {
            try { localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value)); }
            catch (e) { localStorage.clear(); }
        }

        async function fetchWithRetry(url, options, retries = 3, backoff = 400) {
            try {
                const res = await fetch(url, options);
                if (!res.ok && res.status >= 500 && retries > 0) throw new Error();
                return res;
            } catch (err) {
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 1.5);
                }
                throw err;
            }
        }

        function debounce(func, delay = 150) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        const debouncedApplyColumnFilters = debounce(applyColumnFilters, 150);
        const debouncedFilterStoreList = debounce(filterStoreList, 150);

        function formatDate(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            let s = String(dateStr).split('T')[0];
            return s.replace(/-/g, '/');
        }

        function cleanNumber(val) {
            if (!val) return 0;
            return parseFloat(String(val).replace(/[^0-9.-]/g, '')) || 0;
        }

        function cleanCode(val) {
            if (!val && val !== 0) return '-';
            let str = String(val).trim();
            if (str.endsWith('.0')) str = str.substring(0, str.length - 2);
            return str || '-';
        }

        async function loadCalendarData() {
            const monthVal = document.getElementById('calendar-month-picker').value;
            if (!monthVal) return;
            const [year, month] = monthVal.split('-').map(Number);
            const startDateStr = formatDate(new Date(year, month - 1, 1));
            const endDateStr = formatDate(new Date(year, month, 0));

            const queryUrl = `${SUPABASE_URL}/rest/v1/calendar_date_summary?delivery_date=gte.${startDateStr}&delivery_date=lte.${endDateStr}&select=delivery_date,order_count`;

            let dateCountMap = {}, availableDates = [];
            try {
                const res = await fetchWithUltraCache(queryUrl, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (res.ok) {
                    const rows = await res.json();
                    rows.forEach(r => {
                        let dKey = formatDisplayDate(r.delivery_date).replace(/\//g, '-');
                        dateCountMap[dKey] = cleanNumber(r.order_count);
                        if (cleanNumber(r.order_count) > 0) availableDates.push(dKey);
                    });
                }
            } catch (err) {}

            if (availableDates.length > 0) {
                availableDates.sort();
                const latestDate = availableDates[availableDates.length - 1].replace(/-/g, '/');
                document.getElementById('last-updated-text').innerText = `🕒 최신 배송일자: ${latestDate}`;
                safeSetStorage('cached_last_updated', latestDate);
            }
            renderCalendarGrid(year, month, dateCountMap);
        }

        function renderCalendarGrid(year, month, dateCountMap) {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = "";
            ['일', '월', '화', '수', '목', '금', '토'].forEach(d => grid.innerHTML += `<div class="calendar-header-day">${d}</div>`);

            const firstDayIndex = new Date(year, month - 1, 1).getDay();
            const totalDays = new Date(year, month, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) grid.innerHTML += `<div class="calendar-day-cell other-month"></div>`;

            for (let day = 1; day <= totalDays; day++) {
                const dString = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const count = dateCountMap[dString] || 0;
                const badgeHtml = count > 0 ? `<span class="data-status-badge badge-has-data">🟢 있음</span>` : `<span class="data-status-badge badge-no-data">⚪ 없음</span>`;
                const cell = document.createElement('div');
                cell.className = 'calendar-day-cell';
                cell.onclick = () => { document.getElementById('detail-target-date').value = dString; closeCalendarModal(); fetchDetailData(); };
                cell.innerHTML = `<span class="day-number">${day}</span>${badgeHtml}`;
                grid.appendChild(cell);
            }
        }

        /* 📊 추이 차트 수신 (이중 캐시 적용) */
        async function fetchChartData() {
            const startDate = document.getElementById('chart-start-date').value;
            const endDate = document.getElementById('chart-end-date').value;
            const brandInputValue = document.getElementById('chart-brand-input').value.trim();
            const itemKeyword = document.getElementById('chart-item-input').value.trim();

            if (!startDate || !endDate) return alert("시작일과 종료일을 선택하세요.");

            safeSetStorage('cached_chart_start_date', startDate);
            safeSetStorage('cached_chart_end_date', endDate);

            let queryUrl = `${SUPABASE_URL}/rest/v1/daily_order_summary?delivery_date=gte.${startDate}&delivery_date=lte.${endDate}&select=delivery_date,total_qty,total_amount,item_name`;

            if (brandInputValue) {
                const brandList = brandInputValue.split(',').map(b => b.trim()).filter(Boolean);
                if (brandList.length === 1) queryUrl += `&brand_name=ilike.*${encodeURIComponent(brandList[0])}*`;
                else if (brandList.length > 1) queryUrl += `&or=(${brandList.map(b => `brand_name.ilike.*${encodeURIComponent(b)}*`).join(',')})`;
            }

            if (itemKeyword) queryUrl += `&or=(item_code.ilike.*${encodeURIComponent(itemKeyword)}*,item_name.ilike.*${encodeURIComponent(itemKeyword)}*)`;

            try {
                const res = await fetchWithUltraCache(queryUrl, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                if (res.ok) {
                    const data = await res.json();
                    renderChartAndKPI(data);
                }
            } catch (err) {}
        }

        function renderChartAndKPI(data) {
            if (!data || !Array.isArray(data) || data.length === 0) return;

            let totalQty = 0, totalAmount = 0;
            const uniqueItems = new Set();
            const dailyMap = {};

            data.forEach(r => {
                const q = cleanNumber(r.total_qty);
                const amt = cleanNumber(r.total_amount);

                totalQty += q;
                totalAmount += amt;
                if (r.item_name) uniqueItems.add(r.item_name);

                let dateKey = formatDisplayDate(r.delivery_date);
                if (!dateKey || dateKey === '-') return;

                if (!dailyMap[dateKey]) dailyMap[dateKey] = { qty: 0, amount: 0 };
                dailyMap[dateKey].qty += q;
                dailyMap[dateKey].amount += amt;
            });

            document.getElementById('kpi-total-qty').innerText = `${totalQty.toLocaleString()} 건`;
            document.getElementById('kpi-total-items').innerText = `${uniqueItems.size.toLocaleString()} 종`;
            document.getElementById('kpi-total-amount').innerText = `${totalAmount.toLocaleString()} 원`;

            const labels = Object.keys(dailyMap).sort();
            const qtyData = labels.map(k => dailyMap[k].qty);
            const amtData = labels.map(k => dailyMap[k].amount);

            const canvas = document.getElementById('dailyTrendChart');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            if (trendChart) trendChart.destroy();

            trendChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '주문수량', data: qtyData, backgroundColor: 'rgba(37, 99, 235, 0.6)', yAxisID: 'y1' },
                        { label: '주문금액', data: amtData, type: 'line', borderColor: '#8b5cf6', borderWidth: 2, yAxisID: 'y2' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y1: { type: 'linear', position: 'left', beginAtZero: true },
                        y2: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        /* 🛒 하루치 상세 내역 (이중 캐시 적용) */
        async function fetchDetailData() {
            const targetDate = document.getElementById('detail-target-date').value;
            if (!targetDate) return;

            safeSetStorage('cached_detail_target_date', targetDate);

            const summaryUrl = `${SUPABASE_URL}/rest/v1/store_order_summary?delivery_date=eq.${targetDate}&select=store_code,store_name,brand_name,order_count,total_qty,total_amount`;

            try {
                const res = await fetchWithUltraCache(summaryUrl, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                if (res.ok) {
                    storeSummaryList = await res.json();
                    rawDetailOrders = [];
                    updateStoreListAndSummary();
                    fetchAllOrdersInChunks(targetDate);
                }
            } catch (err) {}
        }

        async function fetchAllOrdersInChunks(targetDate) {
            let offset = 0;
            const limit = 200;
            let hasMore = true;
            rawDetailOrders = [];

            while (hasMore) {
                const chunkUrl = `${SUPABASE_URL}/rest/v1/oms_orders?delivery_date=eq.${targetDate}&select=store_code,store_name,order_date,delivery_date,item_code,item_name,qty,price,total_amount,brand_name&order=store_name.asc&limit=${limit}&offset=${offset}`;
                try {
                    const res = await fetchWithUltraCache(chunkUrl, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                    if (res.ok) {
                        const chunk = await res.json();
                        rawDetailOrders = rawDetailOrders.concat(chunk);
                        filteredDetailOrders = rawDetailOrders;

                        const activeStore = document.querySelector('#store-list .active');
                        if (activeStore && activeStore.innerText.includes('전체 점포 합산')) {
                            baseDetailOrders = filteredDetailOrders;
                            applyColumnFilters();
                        }

                        if (chunk.length < limit) hasMore = false;
                        else offset += limit;
                    } else { hasMore = false; }
                } catch(e) { hasMore = false; }
            }
        }

        async function fetchStoreDetailOrders(storeName) {
            const targetDate = document.getElementById('detail-target-date').value;
            const queryUrl = `${SUPABASE_URL}/rest/v1/oms_orders?delivery_date=eq.${targetDate}&store_name=eq.${encodeURIComponent(storeName)}&select=store_code,store_name,order_date,delivery_date,item_code,item_name,qty,price,total_amount,brand_name`;

            try {
                const res = await fetchWithUltraCache(queryUrl, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                if (res.ok) {
                    baseDetailOrders = await res.json();
                    applyColumnFilters();
                }
            } catch(e) {}
        }

        function updateStoreListAndSummary() {
            const stores = [...new Set(storeSummaryList.map(r => r.store_name))].filter(Boolean);
            document.getElementById('brand-store-count').innerText = stores.length;
            document.getElementById('brand-item-count').innerText = '-';

            const storeListEl = document.getElementById('store-list');
            const totalCount = storeSummaryList.reduce((sum, r) => sum + cleanNumber(r.order_count), 0);

            let listItemsHtml = [`<li class="store-item total-item active" onclick="onStoreSelect('ALL', this)">
                <span>🏢 전체 점포 합산</span><span style="color:#2563eb;">${totalCount}건</span>
            </li>`];

            stores.forEach(store => {
                const sData = storeSummaryList.filter(r => r.store_name === store);
                const count = sData.reduce((sum, r) => sum + cleanNumber(r.order_count), 0);
                listItemsHtml.push(`<li class="store-item" onclick="onStoreSelect('${store}', this)">
                    <span>${store}</span><span style="color:#64748b;">${count}건</span>
                </li>`);
            });
            storeListEl.innerHTML = listItemsHtml.join('');
            onStoreSelect('ALL', storeListEl.firstElementChild);
        }

        function filterStoreList() {
            const query = document.getElementById('store-search-input').value.toLowerCase();
            document.querySelectorAll('#store-list .store-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }

        function onStoreSelect(storeName, element) {
            document.querySelectorAll('.store-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            if (storeName === 'ALL') {
                document.getElementById('selected-store-title').innerText = `🛒 전체 점포 합산 상세`;
                baseDetailOrders = filteredDetailOrders;
                applyColumnFilters();
            } else {
                document.getElementById('selected-store-title').innerText = `🛒 [${storeName}] 주문 상세`;
                fetchStoreDetailOrders(storeName);
            }
        }

        function applyColumnFilters() {
            const qSC = document.getElementById('filter-storeCode').value.toLowerCase().trim();
            const qSN = document.getElementById('filter-storeName').value.toLowerCase().trim();
            const qOD = document.getElementById('filter-orderDate').value.toLowerCase().trim();
            const qDD = document.getElementById('filter-deliveryDate').value.toLowerCase().trim();
            const qIC = document.getElementById('filter-itemCode').value.toLowerCase().trim();
            const qIN = document.getElementById('filter-itemName').value.toLowerCase().trim();

            currentDetailOrders = baseDetailOrders.filter(row => {
                if (qSC && !cleanCode(row.store_code).toLowerCase().includes(qSC)) return false;
                if (qSN && !String(row.store_name||'').toLowerCase().includes(qSN)) return false;
                if (qOD && !formatDisplayDate(row.order_date).toLowerCase().includes(qOD)) return false;
                if (qDD && !formatDisplayDate(row.delivery_date).toLowerCase().includes(qDD)) return false;
                if (qIC && !cleanCode(row.item_code).toLowerCase().includes(qIC)) return false;
                if (qIN && !String(row.item_name||'').toLowerCase().includes(qIN)) return false;
                return true;
            });

            renderDetailTable();
        }

        function renderDetailTable() {
            const tbody = document.getElementById('order-detail-table');

            if (!currentDetailOrders || currentDetailOrders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#94a3b8;">데이터를 로딩 중이거나 없습니다.</td></tr>`;
                document.getElementById('list-total-qty').innerText = "0";
                document.getElementById('list-total-amount').innerText = "0";
                return;
            }

            let sumQty = 0, sumAmount = 0;
            const rowsHtml = currentDetailOrders.map(row => {
                const q = cleanNumber(row.qty), p = cleanNumber(row.price);
                let t = cleanNumber(row.total_amount) || (q * p);
                sumQty += q; sumAmount += t;

                return `
                    <tr>
                        <td><span class="code-tag">${cleanCode(row.store_code)}</span></td>
                        <td><b>${row.store_name||'-'}</b></td>
                        <td>${formatDisplayDate(row.order_date)}</td>
                        <td><span style="color:#2563eb; font-weight:bold;">${formatDisplayDate(row.delivery_date)}</span></td>
                        <td><span class="code-tag">${cleanCode(row.item_code)}</span></td>
                        <td>${row.item_name||'-'}</td>
                        <td class="text-right">${q.toLocaleString()}</td>
                        <td class="text-right">${p > 0 ? p.toLocaleString() + '원' : '-'}</td>
                        <td class="text-right"><b>${t > 0 ? t.toLocaleString() + '원' : '-'}</b></td>
                    </tr>
                `;
            });

            tbody.innerHTML = rowsHtml.join('');
            document.getElementById('list-total-qty').innerText = sumQty.toLocaleString();
            document.getElementById('list-total-amount').innerText = sumAmount.toLocaleString();
        }

        function exportToExcel() {
            if (!currentDetailOrders || currentDetailOrders.length === 0) return alert("저장할 데이터가 없습니다.");

                        btn.disabled = false; 
                        btn.innerText = "🚀 OMS 수동 동기화";

                    }, 35000);
                } else {

            } catch (err) {
