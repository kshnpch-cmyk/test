<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가격 비교 대시보드</title>
    <!-- 데이터 파싱 라이브러리 (차트 라이브러리 삭제됨) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        
        .container { width: 100%; margin: 0 auto; }
        
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 24px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-bottom: 24px; 
        }
        
        h1 { margin-top: 0; font-size: 24px; color: #111; }
        
        /* 🔥 요약 통계(KPI) 카드 스타일 */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .kpi-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
        }
        .kpi-title { font-size: 13px; color: #6c757d; font-weight: 600; margin-bottom: 8px; }
        .kpi-value { font-size: 24px; font-weight: bold; color: #212529; margin-bottom: 12px; }
        .kpi-list { font-size: 13px; color: #495057; line-height: 1.5; margin: 0; padding: 0; list-style: none; }
        .kpi-list li { display: flex; justify-content: space-between; border-bottom: 1px dashed #dee2e6; padding: 4px 0; }
        .kpi-list li:last-child { border-bottom: none; }

        .text-blue { color: #3b82f6; }
        .text-red { color: #ef4444; }

        /* 테이블 스타일 */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background-color: #f1f3f5; font-weight: 600; color: #495057; vertical-align: top; }
        tr:hover { background-color: #f8f9fa; }

        /* 필터 입력창 스타일 */
        .filter-input {
            width: 100%; padding: 6px 8px; margin-top: 8px;
            border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none;
        }
        .filter-input:focus { border-color: #3b82f6; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>📊 실시간 가격 경쟁력 현황</h1>
        
        <!-- 🔥 추가된 부분: 요약 통계(KPI) 영역 -->
        <div class="summary-grid">
            <div class="kpi-box">
                <div class="kpi-title">📦 전체 품목 수</div>
                <div class="kpi-value" id="kpiTotal">0건</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">💰 가격 경쟁력 (자사 기준)</div>
                <ul class="kpi-list">
                    <li><span>우세 (자사가 저렴)</span> <strong class="text-blue" id="kpiWin">0건</strong></li>
                    <li><span>열세 (자사가 비쌈)</span> <strong class="text-red" id="kpiLose">0건</strong></li>
                    <li><span>동일가격</span> <strong id="kpiTie">0건</strong></li>
                </ul>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">👤 사람별 (담당자) 현황</div>
                <ul class="kpi-list" id="kpiPerson">
                    <li>데이터 분석 중...</li>
                </ul>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">⭐ 필수품목 현황</div>
                <ul class="kpi-list" id="kpiRequired">
                    <li>데이터 분석 중...</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top:0; font-size: 18px;">전체 데이터 상세 (검색 가능)</h2>
        <div class="table-responsive">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const sheetId = '1nA0ZtCztY6Qe8UR8-erB98_BIZDYUUjpIQYWNyuePWA';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0`;

    // ⚠️ 중요: 구글 시트의 1행(헤더)에 적힌 글자와 완벽히 일치해야 숫자가 정상 계산됩니다.
    const COL_OUR_PRICE = '자사가격';     // 자사 가격 열 이름
    const COL_NET_PRICE = '최저가';       // 인터넷 최저가 열 이름
    const COL_PERSON = '담당자';          // 사람(담당자) 열 이름
    const COL_REQUIRED = '필수여부';      // 필수 여부 열 이름

    Papa.parse(csvUrl, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data.filter(row => Object.keys(row).length > 0 && Object.values(row)[0] !== "");
            renderSummary(data);
            renderTable(data);
        },
        error: function(error) {
            console.error("데이터 로드 실패:", error);
            alert("구글 시트 데이터를 불러오지 못했습니다.");
        }
    });

    // 🔥 추가된 부분: 요약 통계 계산 함수
    function renderSummary(data) {
        let win = 0, lose = 0, tie = 0;
        let personCounts = {};
        let requiredCounts = {};

        data.forEach(row => {
            // 1. 가격 우세/열세 계산
            let ourPrice = Number((row[COL_OUR_PRICE] || '0').replace(/[^0-9.-]+/g,""));
            let netPrice = Number((row[COL_NET_PRICE] || '0').replace(/[^0-9.-]+/g,""));
            
            if(ourPrice > 0 && netPrice > 0) {
                if(ourPrice < netPrice) win++;
                else if(ourPrice > netPrice) lose++;
                else tie++;
            }

            // 2. 사람(담당자)별 집계
            let person = row[COL_PERSON] || '미지정';
            personCounts[person] = (personCounts[person] || 0) + 1;

            // 3. 필수여부 집계
            let required = row[COL_REQUIRED] || '미지정';
            requiredCounts[required] = (requiredCounts[required] || 0) + 1;
        });

        // HTML에 통계 결과 밀어넣기
        document.getElementById('kpiTotal').textContent = data.length + "건";
        document.getElementById('kpiWin').textContent = win + "건";
        document.getElementById('kpiLose').textContent = lose + "건";
        document.getElementById('kpiTie').textContent = tie + "건";

        // 객체를 리스트(HTML)로 변환하는 헬퍼 함수
        const generateListHTML = (obj) => {
            const entries = Object.entries(obj).sort((a, b) => b[1] - a[1]); // 건수 많은 순 정렬
            if(entries.length === 0 || (entries.length === 1 && entries[0][0] === '미지정')) {
                return `<li>해당 열(Column)을 찾을 수 없음</li>`;
            }
            return entries.map(([key, count]) => `<li><span>${key}</span> <strong>${count}건</strong></li>`).join('');
        };

        document.getElementById('kpiPerson').innerHTML = generateListHTML(personCounts);
        document.getElementById('kpiRequired').innerHTML = generateListHTML(requiredCounts);
    }

    // 테이블 렌더링 (이전과 동일)
    function renderTable(data) {
        if(data.length === 0) return;
        const headers = Object.keys(data[0]);
        
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        thead.innerHTML = ''; tbody.innerHTML = '';

        const trHead = document.createElement('tr');
        headers.forEach((h, index) => {
            const th = document.createElement('th');
            th.textContent = h;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'filter-input';
            input.placeholder = h + ' 검색';
            input.dataset.colIndex = index;
            input.addEventListener('keyup', filterTable);

            th.appendChild(document.createElement('br'));
            th.appendChild(input);
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        data.forEach(row => {
            const tr = document.createElement('tr');
            headers.forEach(h => {
                const td = document.createElement('td');
                td.textContent = row[h] || '-';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    // 필터링 로직 (이전과 동일)
    function filterTable() {
        const inputs = document.querySelectorAll('.filter-input');
        const filters = Array.from(inputs).map(input => input.value.toLowerCase().trim());
        const tbody = document.getElementById('tableBody');
        const rows = tbody.getElementsByTagName('tr');

        for (let i = 0; i < rows.length; i++) {
            const cells = rows[i].getElementsByTagName('td');
            let displayRow = true;

            for (let j = 0; j < filters.length; j++) {
                const filterValue = filters[j];
                if (filterValue) {
                    const cellText = cells[j].textContent.toLowerCase();
                    if (cellText.indexOf(filterValue) === -1) {
                        displayRow = false;
                        break;
                    }
                }
            }
            rows[i].style.display = displayRow ? '' : 'none';
        }
    }
</script>

</body>
</html>
