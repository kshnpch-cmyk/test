<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가격 비교 대시보드</title>
    <!-- 데이터 파싱 및 차트 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        
        .container { width: 100%; margin: 0 auto; }
        
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 24px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-bottom: 24px; 
        }
        
        h1 { margin-top: 0; font-size: 24px; color: #111; }
        .chart-container { position: relative; height: 400px; width: 100%; }
        
        .table-responsive { width: 100%; overflow-x: auto; }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 14px; 
            white-space: nowrap; 
        }
        
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background-color: #f1f3f5; font-weight: 600; color: #495057; vertical-align: top; }
        tr:hover { background-color: #f8f9fa; }

        /* 🔥 추가된 부분: 필터 입력창 스타일 */
        .filter-input {
            width: 100%;
            padding: 6px 8px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        .filter-input:focus { border-color: #3b82f6; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>📊 실시간 가격 경쟁력 대시보드</h1>
        <p>구글 스프레드시트 데이터가 실시간으로 반영됩니다.</p>
    </div>

    <div class="card">
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top:0; font-size: 18px;">전체 데이터 상세</h2>
        <div class="table-responsive">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const sheetId = '1nA0ZtCztY6Qe8UR8-erB98_BIZDYUUjpIQYWNyuePWA';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0`;

    Papa.parse(csvUrl, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data.filter(row => Object.keys(row).length > 0 && Object.values(row)[0] !== "");
            renderTable(data);
            renderChart(data);
        },
        error: function(error) {
            console.error("데이터 로드 실패:", error);
            alert("구글 시트 데이터를 불러오지 못했습니다.");
        }
    });

    function renderTable(data) {
        if(data.length === 0) return;
        const headers = Object.keys(data[0]);
        
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        
        // 초기화 (재렌더링 방지)
        thead.innerHTML = '';
        tbody.innerHTML = '';

        // 1. 헤더 및 필터 입력창 생성
        const trHead = document.createElement('tr');
        headers.forEach((h, index) => {
            const th = document.createElement('th');
            th.textContent = h; // 컬럼명 텍스트

            // 필터 검색창 추가
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'filter-input';
            input.placeholder = h + ' 검색';
            input.dataset.colIndex = index;
            
            // 키보드 입력 시 필터링 함수 실행
            input.addEventListener('keyup', filterTable);

            th.appendChild(document.createElement('br')); // 줄바꿈
            th.appendChild(input);
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        // 2. 테이블 본문 데이터 생성
        data.forEach(row => {
            const tr = document.createElement('tr');
            headers.forEach(h => {
                const td = document.createElement('td');
                td.textContent = row[h] || '-';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    // 🔥 추가된 부분: 테이블 필터링 로직
    function filterTable() {
        const inputs = document.querySelectorAll('.filter-input');
        const filters = Array.from(inputs).map(input => input.value.toLowerCase().trim());
        const tbody = document.getElementById('tableBody');
        const rows = tbody.getElementsByTagName('tr');

        for (let i = 0; i < rows.length; i++) {
            const cells = rows[i].getElementsByTagName('td');
            let displayRow = true;

            for (let j = 0; j < filters.length; j++) {
                const filterValue = filters[j];
                // 검색어가 입력된 열(Column)에 대해서만 검사
                if (filterValue) {
                    const cellText = cells[j].textContent.toLowerCase();
                    if (cellText.indexOf(filterValue) === -1) {
                        displayRow = false;
                        break; // 하나라도 조건에 안 맞으면 행 숨김 처리
                    }
                }
            }
            // 조건에 맞으면 보이고, 안 맞으면 숨기기
            rows[i].style.display = displayRow ? '' : 'none';
        }
    }

    function renderChart(data) {
        if(data.length === 0) return;
        
        // ⚠️ 구글 시트의 실제 헤더 이름에 맞춰 '상품명', '자사가격', '최저가'를 수정해야 차트가 보입니다.
        const labels = data.map(row => row['상품명'] || row[Object.keys(row)[0]]); 
        const ourPrices = data.map(row => Number((row['자사가격'] || '0').replace(/[^0-9.-]+/g,"")));
        const lowestPrices = data.map(row => Number((row['최저가'] || '0').replace(/[^0-9.-]+/g,"")));

        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: '자사가격', data: ourPrices, backgroundColor: '#3b82f6', borderRadius: 4 },
                    { label: '인터넷최저가', data: lowestPrices, backgroundColor: '#ef4444', borderRadius: 4 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    }
</script>

</body>
</html>
