<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가격 비교 대시보드</title>
    <!-- 데이터 파싱 및 차트 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 24px; }
        h1 { margin-top: 0; font-size: 24px; color: #111; }
        .chart-container { position: relative; height: 400px; width: 100%; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background-color: #f1f3f5; font-weight: 600; color: #495057; }
        tr:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>📊 실시간 가격 경쟁력 대시보드</h1>
        <p>구글 스프레드시트 데이터가 실시간으로 반영됩니다.</p>
    </div>

    <div class="card">
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top:0; font-size: 18px;">전체 데이터 상세</h2>
        <div style="overflow-x: auto;">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 구글 시트 CSV 내보내기 링크
    const sheetId = '1nA0ZtCztY6Qe8UR8-erB98_BIZDYUUjpIQYWNyuePWA';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0`;

    // PapaParse로 구글 시트 데이터 가져오기
    Papa.parse(csvUrl, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data.filter(row => Object.keys(row).length > 0 && Object.values(row)[0] !== "");
            renderTable(data);
            renderChart(data);
        },
        error: function(error) {
            console.error("데이터 로드 실패:", error);
            alert("구글 시트 데이터를 불러오지 못했습니다. 시트 공유 권한이 '링크가 있는 모든 사용자'인지 확인해주세요.");
        }
    });

    // 테이블 렌더링 함수
    function renderTable(data) {
        if(data.length === 0) return;
        const headers = Object.keys(data[0]);
        
        const thead = document.getElementById('tableHead');
        const trHead = document.createElement('tr');
        headers.forEach(h => {
            const th = document.createElement('th');
            th.textContent = h;
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        const tbody = document.getElementById('tableBody');
        data.forEach(row => {
            const tr = document.createElement('tr');
            headers.forEach(h => {
                const td = document.createElement('td');
                td.textContent = row[h] || '-';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    // 차트 렌더링 함수
    function renderChart(data) {
        if(data.length === 0) return;
        
        // ⚠️ 주의: 아래 ['상품명'], ['자사가격'], ['최저가'] 부분은 
        // 실제 구글 시트의 1행(헤더)에 적힌 글자와 완전히 똑같이 수정해야 차트가 나옵니다.
        const labels = data.map(row => row['상품명'] || row[Object.keys(row)[0]]); 
        const ourPrices = data.map(row => Number((row['자사가격'] || '0').replace(/[^0-9.-]+/g,"")));
        const lowestPrices = data.map(row => Number((row['최저가'] || '0').replace(/[^0-9.-]+/g,"")));

        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: '자사가격', data: ourPrices, backgroundColor: '#3b82f6', borderRadius: 4 },
                    { label: '인터넷최저가', data: lowestPrices, backgroundColor: '#ef4444', borderRadius: 4 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    }
</script>

</body>
</html>
