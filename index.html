<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가격 비교 대시보드</title>
    <!-- 데이터 파싱 및 엑셀 생성 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .container { width: 100%; display: flex; flex-direction: column; flex: 1; min-height: 0; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .kpi-card { flex-shrink: 0; margin-bottom: 20px; }
        .table-card { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-bottom: 0; }
        h1 { margin-top: 0; font-size: 24px; color: #111; margin-bottom: 20px; }
        
        .summary-grid { display: grid; grid-template-columns: 0.8fr 1.6fr 1.3fr 1.3fr; gap: 16px; }
        @media (max-width: 1024px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .summary-grid { grid-template-columns: 1fr; } }

        .kpi-box { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; }
        .kpi-title { font-size: 13px; color: #6c757d; font-weight: 600; margin-bottom: 10px; }
        .kpi-value { font-size: 24px; font-weight: bold; color: #212529; margin-bottom: 12px; }
        .kpi-list { font-size: 13px; color: #495057; line-height: 1.5; margin: 0; padding: 0; list-style: none; }
        .kpi-list li { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #dee2e6; padding: 4px 0; }
        .kpi-list li:last-child { border-bottom: none; }
        
        .text-blue { color: #2563eb; }
        .text-red { color: #dc2626; }
        .text-gray { color: #4b5563; }

        .global-select { width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; outline: none; background-color: white; cursor: pointer; margin-top: auto; }
        .global-select:focus { border-color: #3b82f6; }
        .table-responsive { width: 100%; flex: 1; overflow: auto; border: 1px solid #e9ecef; border-radius: 4px; min-height: 0; }
        
        table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; table-layout: auto; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; border-right: 1px solid #eee; text-align: left; white-space: nowrap; }
        td:last-child, th:last-child { border-right: none; }
        thead th { position: sticky !important; top: 0; background-color: #f1f3f5; font-weight: 600; color: #495057; vertical-align: top; z-index: 10; box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.1); position: relative; }
        
        table.is-fixed { table-layout: fixed; width: auto; }
        table.is-fixed th, table.is-fixed td { white-space: normal !important; word-break: break-word !important; overflow: hidden; }

        tr.highlight-win td { background-color: #eff6ff !important; color: #1d4ed8 !important; font-weight: 500; }
        tr.highlight-lose td { background-color: #fef2f2 !important; color: #b91c1c !important; font-weight: 500; }
        tr.highlight-tie td { background-color: #f3f4f6 !important; color: #4b5563 !important; font-weight: 500; }
        tr:hover td { background-color: #f8f9fa; }
        tr.highlight-win:hover td { background-color: #dbeafe !important; }
        tr.highlight-lose:hover td { background-color: #fee2e2 !important; }

        .filter-input { width: 100%; padding: 6px 8px; margin-top: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; }
        .filter-input:focus { border-color: #3b82f6; }
        .summary-badge { font-size: 14px; color: #6366f1; font-weight: normal; margin-left: 10px; }
        
        /* 버튼 스타일 */
        .table-header-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 8px; }
        .btn-save { background-color: #ffffff; border: 1px solid #ced4da; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; color: #495057; font-weight: 600; transition: 0.2s; }
        .btn-save:hover { background-color: #f1f3f5; }
        
        /* 🔥 새로 추가된 엑셀 저장 버튼 스타일 */
        .btn-excel { background-color: #10b981; border: 1px solid #059669; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; color: white; font-weight: 600; transition: 0.2s; }
        .btn-excel:hover { background-color: #059669; }

        .resizer { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; user-select: none; background-color: transparent; z-index: 11; }
        .resizer:hover, .resizer.resizing { background-color: #3b82f6; }
        body.resizing-active { user-select: none; cursor: col-resize; }
        
        .kpi-check-label { display: flex; align-items: center; cursor: pointer; font-size: 13px; margin: 0; }
        .kpi-check-label input { margin-right: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="card kpi-card">
        <h1>📊 실시간 가격 경쟁력 현황</h1>
        <div class="summary-grid">
            <div class="kpi-box">
                <div class="kpi-title">📦 조회된 품목 수</div>
                <div class="kpi-value" id="kpiTotal">0건</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">💰 가격 경쟁력 (차액 기준) - <span>체크 시 표 색상 강조</span></div>
                <ul class="kpi-list">
                    <li>
                        <label class="kpi-check-label"><input type="checkbox" id="chkWin" onchange="applyRowHighlights()"> <span class="text-blue">우세 (차액 -)</span></label>
                        <strong class="text-blue" id="kpiWin">0건</strong>
                    </li>
                    <li>
                        <label class="kpi-check-label"><input type="checkbox" id="chkLose" onchange="applyRowHighlights()"> <span class="text-red">열세 (차액 +)</span></label>
                        <strong class="text-red" id="kpiLose">0건</strong>
                    </li>
                    <li>
                        <label class="kpi-check-label"><input type="checkbox" id="chkTie" onchange="applyRowHighlights()"> <span class="text-gray">동일가격 (차액 0)</span></label>
                        <strong class="text-gray" id="kpiTie">0건</strong>
                    </li>
                </ul>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">👤 담당자 필터 (관리자1 기준)</div>
                <select id="filterPerson" class="global-select" onchange="applyFilters()">
                    <option value="">모든 담당자 보기</option>
                </select>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">⭐ 필수/권장 필터</div>
                <select id="filterRequired" class="global-select" onchange="applyFilters()">
                    <option value="">전체 품목 보기</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card table-card">
        <div class="table-header-wrap">
            <h2 id="tableTitle" style="margin:0; font-size: 18px;">데이터 상세</h2>
            <div class="btn-group">
                <button class="btn-save" onclick="saveColumnWidths()">💾 셀 너비 저장</button>
                <!-- 🔥 엑셀 저장 버튼 추가 -->
                <button class="btn-excel" onclick="exportToExcel()">📥 엑셀 저장</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const sheetId = '1nA0ZtCztY6Qe8UR8-erB98_BIZDYUUjpIQYWNyuePWA';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0`;

    const COL_OUR_PRICE = '자사가격';
    const COL_NET_PRICE = '최저가';
    const COL_DIFF = '차액';
    const COL_PERSON = '관리자1';
    const COL_REQUIRED = '필수/권장';

    let allData = []; 
    let headers = [];
    let currentFilteredData = []; // 🔥 현재 필터링된 데이터를 엑셀용으로 저장할 변수

    Papa.parse(csvUrl, {
        download: true,
        header: false, 
        complete: function(results) {
            const rawData = results.data.filter(row => row.length > 0 && row.some(cell => cell !== ""));
            if(rawData.length < 2) return;

            const row1 = rawData[0];
            const row2 = rawData[1];
            let combinedHeaders = [];
            let lastHeader = "";

            for(let i = 0; i < row1.length; i++) {
                let top = row1[i] ? row1[i].trim() : "";
                let bottom = row2[i] ? row2[i].trim() : "";
                if(top !== "") lastHeader = top;
                if(bottom !== "" && bottom !== top) {
                    combinedHeaders.push(lastHeader ? `${lastHeader} ${bottom}` : bottom);
                } else {
                    combinedHeaders.push(lastHeader || bottom || `열_${i}`);
                }
            }
            headers = combinedHeaders;

            allData = [];
            for(let r = 2; r < rawData.length; r++) {
                let obj = {};
                for(let c = 0; c < headers.length; c++) {
                    obj[headers[c]] = rawData[r][c] || "";
                }
                allData.push(obj);
            }

            initGlobalFilters();
            renderTableHeader();
            applyFilters(); 
        },
        error: function(error) { console.error("데이터 로드 실패:", error); }
    });

    function initGlobalFilters() {
        const persons = [...new Set(allData.map(r => r[COL_PERSON]).filter(v => v))];
        const personSelect = document.getElementById('filterPerson');
        persons.forEach(p => { const opt = document.createElement('option'); opt.value = p; opt.textContent = p; personSelect.appendChild(opt); });

        const reqs = [...new Set(allData.map(r => r[COL_REQUIRED]).filter(v => v))];
        const reqSelect = document.getElementById('filterRequired');
        reqs.forEach(r => { const opt = document.createElement('option'); opt.value = r; opt.textContent = r; reqSelect.appendChild(opt); });
    }

    function renderTableHeader() {
        const thead = document.getElementById('tableHead');
        const trHead = document.createElement('tr');
        
        headers.forEach(h => {
            const th = document.createElement('th');
            th.textContent = h;

            const input = document.createElement('input');
            input.type = 'text'; input.className = 'filter-input'; input.placeholder = h + ' 검색';
            input.dataset.colName = h;
            input.addEventListener('keyup', applyFilters); 

            th.appendChild(document.createElement('br'));
            th.appendChild(input);
            
            const resizer = document.createElement('div'); resizer.className = 'resizer';
            th.appendChild(resizer);
            
            createResizableColumn(th, resizer);
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);
        loadColumnWidths();
    }

    function saveColumnWidths() {
        const table = document.getElementById('dataTable');
        const ths = table.querySelectorAll('thead th');
        let widths = [];
        ths.forEach(th => {
            let w = th.style.width ? parseInt(th.style.width, 10) : th.offsetWidth;
            widths.push(w);
        });
        localStorage.setItem('my_dashboard_widths', JSON.stringify(widths));
        alert('현재 셀 너비가 저장되었습니다.');
    }

    function loadColumnWidths() {
        const saved = localStorage.getItem('my_dashboard_widths');
        if (saved) {
            try {
                const widths = JSON.parse(saved);
                const table = document.getElementById('dataTable');
                const ths = table.querySelectorAll('thead th');
                if (ths.length === widths.length) {
                    ths.forEach((th, i) => {
                        th.style.width = `${widths[i]}px`; th.style.minWidth = `${widths[i]}px`; th.style.maxWidth = `${widths[i]}px`;
                    });
                    table.classList.add('is-fixed');
                    table.style.width = widths.reduce((sum, w) => sum + w, 0) + 'px';
                }
            } catch(e) {}
        }
    }

    function lockTableWidths() {
        const table = document.getElementById('dataTable');
        if (table.classList.contains('is-fixed')) return;
        const ths = table.querySelectorAll('thead th');
        const widths = Array.from(ths).map(th => th.offsetWidth);
        ths.forEach((th, i) => {
            th.style.width = `${widths[i]}px`; th.style.minWidth = `${widths[i]}px`; th.style.maxWidth = `${widths[i]}px`;
        });
        table.classList.add('is-fixed');
        table.style.width = widths.reduce((sum, w) => sum + w, 0) + 'px';
    }

    function createResizableColumn(th, resizer) {
        let x = 0; let w = 0;
        const mouseDownHandler = function(e) {
            lockTableWidths(); x = e.clientX; w = th.offsetWidth; 
            document.addEventListener('mousemove', mouseMoveHandler); document.addEventListener('mouseup', mouseUpHandler);
            resizer.classList.add('resizing'); document.body.classList.add('resizing-active');
        };
        const mouseMoveHandler = function(e) {
            const dx = e.clientX - x; const newWidth = Math.max(50, w + dx); 
            if (newWidth !== w) {
                th.style.width = `${newWidth}px`; th.style.minWidth = `${newWidth}px`; th.style.maxWidth = `${newWidth}px`;
                const table = document.getElementById('dataTable'); const ths = table.querySelectorAll('thead th');
                let totalWidth = 0; ths.forEach(col => { totalWidth += parseInt(col.style.width, 10) || col.offsetWidth; });
                table.style.width = `${totalWidth}px`;
                x = e.clientX; w = newWidth;
            }
        };
        const mouseUpHandler = function() {
            document.removeEventListener('mousemove', mouseMoveHandler); document.removeEventListener('mouseup', mouseUpHandler);
            resizer.classList.remove('resizing'); document.body.classList.remove('resizing-active');
        };
        resizer.addEventListener('mousedown', mouseDownHandler);
    }

    function applyFilters() {
        const personVal = document.getElementById('filterPerson').value; const reqVal = document.getElementById('filterRequired').value;
        const inputs = document.querySelectorAll('.filter-input');
        const colFilters = Array.from(inputs).map(inp => ({ col: inp.dataset.colName, val: inp.value.toLowerCase().trim() }));

        const filteredData = allData.filter(row => {
            if (personVal && row[COL_PERSON] !== personVal) return false;
            if (reqVal && row[COL_REQUIRED] !== reqVal) return false;
            for (let f of colFilters) {
                if (f.val) {
                    const cellVal = (row[f.col] || '').toLowerCase();
                    if (cellVal.indexOf(f.val) === -1) return false;
                }
            }
            return true;
        });

        currentFilteredData = filteredData; // 🔥 현재 필터링 상태 저장 (엑셀 다운로드용)

        updateSummary(filteredData);
        renderTableBody(filteredData);
    }

    function getRowStatus(row) {
        let diff = 0;
        if(row[COL_DIFF] !== undefined && row[COL_DIFF] !== '') { diff = Number(row[COL_DIFF].replace(/[^0-9.-]+/g, "")); } 
        else {
            let ourPrice = Number((row[COL_OUR_PRICE] || '0').replace(/[^0-9.-]+/g, "")); let netPrice = Number((row[COL_NET_PRICE] || '0').replace(/[^0-9.-]+/g, ""));
            if (ourPrice > 0 || netPrice > 0) diff = ourPrice - netPrice; else return 'none';
        }
        if(diff < 0) return 'win';
        if(diff > 0) return 'lose';
        return 'tie';
    }

    function updateSummary(data) {
        let win = 0, lose = 0, tie = 0; let reqCounts = {}; 

        data.forEach(row => {
            let status = getRowStatus(row);
            if(status === 'win') win++; else if(status === 'lose') lose++; else if(status === 'tie') tie++;
            let reqType = row[COL_REQUIRED] || '미지정'; reqCounts[reqType] = (reqCounts[reqType] || 0) + 1;
        });

        document.getElementById('kpiTotal').textContent = data.length + "건";
        document.getElementById('kpiWin').textContent = win + "건"; document.getElementById('kpiLose').textContent = lose + "건"; document.getElementById('kpiTie').textContent = tie + "건";

        const titleEl = document.getElementById('tableTitle');
        const reqString = Object.entries(reqCounts).filter(([key]) => key !== '미지정' && key !== '').sort((a, b) => b[1] - a[1]).map(([key, val]) => `${key} ${val}건`).join(' / ');
        
        if (reqString.length > 0) { titleEl.innerHTML = `데이터 상세 <span class="summary-badge">(현재 조건: ${reqString})</span>`; } 
        else { titleEl.innerHTML = `데이터 상세`; }
    }

    function renderTableBody(data) {
        const tbody = document.getElementById('tableBody'); tbody.innerHTML = ''; 
        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.dataset.status = getRowStatus(row); 
            headers.forEach(h => {
                const td = document.createElement('td'); td.textContent = row[h] || '-'; tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        applyRowHighlights();
    }

    function applyRowHighlights() {
        const chkWin = document.getElementById('chkWin').checked; const chkLose = document.getElementById('chkLose').checked; const chkTie = document.getElementById('chkTie').checked;
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(tr => {
            const status = tr.dataset.status;
            tr.classList.remove('highlight-win', 'highlight-lose', 'highlight-tie');
            if (status === 'win' && chkWin) tr.classList.add('highlight-win');
            if (status === 'lose' && chkLose) tr.classList.add('highlight-lose');
            if (status === 'tie' && chkTie) tr.classList.add('highlight-tie');
        });
    }

    // 🔥 엑셀 다운로드 함수
    function exportToExcel() {
        if (currentFilteredData.length === 0) {
            alert("내보낼 데이터가 없습니다.");
            return;
        }
        
        // 1. 워크시트 생성 (json 데이터를 엑셀 시트로 변환)
        const ws = XLSX.utils.json_to_sheet(currentFilteredData, { header: headers });
        
        // 2. 워크북 생성 및 워크시트 추가
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "가격경쟁력_데이터");
        
        // 3. 파일로 저장
        XLSX.writeFile(wb, "가격경쟁력_대시보드.xlsx");
    }
</script>

</body>
</html>
