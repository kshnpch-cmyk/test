<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>뉴스 브리핑 리포트</title>
  <style>
    body { font-family: '맑은 고딕', sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; line-height: 1.6; }
    .tag-box { background: #f0f4f8; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: #2b6cb0; }
    .news-title { font-size: 24px; font-weight: bold; color: #1a202c; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .news-body { margin-top: 20px; }
    #loading { text-align: center; font-size: 18px; color: #666; padding: 50px; }
  </style>
</head>
<body>

  <div id="loading">데이터를 불러오는 중입니다...</div>
  
  <div id="content" style="display: none;">
    <div id="tags" class="tag-box"></div>
    <h1 id="title" class="news-title"></h1>
    <div id="body" class="news-body"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwkXeyBuPaCPrdpRM5QjJlnqlUVGrRBv5V78S9r9jZn1k3bhGWSo3jI8TMDGckTClME/exec";

    async function fetchData() {
      try {
        const response = await fetch(GAS_URL, { redirect: "follow" });
        const data = await response.json();
        
        console.log("수신 데이터:", data);

        if (data.error) {
          document.getElementById('loading').innerText = "오류: " + data.error;
          return;
        }

        // 받아온 데이터 화면에 바인딩
        document.getElementById('title').innerText = data.title || "제목 없음";
        document.getElementById('tags').innerText = "🏷️ 태그: " + (data.tags || "태그 없음");
        document.getElementById('body').innerHTML = data.html || "본문 없음";

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

      } catch (error) {
        console.error("데이터 불러오기 실패:", error);
        document.getElementById('loading').innerText = "데이터를 불러오는 중 오류가 발생했습니다.";
      }
    }

    fetchData();
  </script>
</body>
</html>
